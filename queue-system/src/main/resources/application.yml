spring:
  application:
    name: queue-system
  
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
    url: jdbc:postgresql://localhost:5432/postgres
    driver-class-name: org.postgresql.Driver
    username: "eunseong"
    password: "eunseong123"

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus, metrics, health, info
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    enable:
      redis: true
    distribution:
      percentiles-histograms:
        all: true
    tags:
      application: ${spring.application.name}
  health:
    redis:
      enabled: true


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

server:
  tomcat:
    mbeanregistry:
      enabled: true