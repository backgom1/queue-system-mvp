spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s
      connect-timeout: 500ms
      lettuce:
        pool:
          enabled: true
          max-active: 1024
          max-idle: 32
          min-idle: 16
          max-wait: 1s
  application:
    name: queue-system
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus,metrics,health
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
    metrics:
      access: unrestricted
  metrics:
    enable:
      commons.pool2: true
      redis: true
    distribution:
      percentiles-histogram:
        all: true
    tags:
      application: ${spring.application.name}
  health:
    redis:
      enabled: true


logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO

server:
  address: 0.0.0.0
  tomcat:
    threads:
      max: 300
    max-connections: 13000
    accept-count: 10000
    mbeanregistry:
      enabled: true
