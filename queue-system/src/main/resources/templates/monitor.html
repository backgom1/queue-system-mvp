<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Queue Monitor V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-dark text-white">
<div class="container py-5">
    <div class="row mb-4">
        <div class="col">
            <h1 class="display-5">Queue System V2 Dashboard</h1>
            <p class="lead mb-0">contentId: <span id="contentIdLabel">concert-iu-2025</span></p>
        </div>
        <div class="col-auto d-flex align-items-center gap-2">
            <span id="monitorModeLabel" class="badge text-bg-secondary">MONITOR OFF</span>
            <button id="btnToggleMonitor" class="btn btn-sm btn-outline-light">Turn ON</button>
        </div>
    </div>

    <div class="row mb-4 text-center">
        <div class="col-md-4">
            <div class="card bg-secondary mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title text-warning">WAITING</h5>
                    <h2 id="waitCount" class="display-6 fw-bold">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-secondary mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title text-success">ACTIVE TICKETS</h5>
                    <h2 id="activeTicketCount" class="display-6 fw-bold">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-secondary mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title text-info">ACTIVE TOKENS</h5>
                    <h2 id="activeTokenCount" class="display-6 fw-bold">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card bg-light p-4 shadow">
                <canvas id="queueChart" style="height: 380px; width: 100%;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const CONTENT_ID = 'concert-iu-2025';
    document.getElementById('contentIdLabel').innerText = CONTENT_ID;
    const monitorModeLabel = document.getElementById('monitorModeLabel');
    const btnToggleMonitor = document.getElementById('btnToggleMonitor');

    const waitCountEl = document.getElementById('waitCount');
    const activeTicketCountEl = document.getElementById('activeTicketCount');
    const activeTokenCountEl = document.getElementById('activeTokenCount');
    let monitorTimer = null;
    let monitorOn = false;

    const ctx = document.getElementById('queueChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Waiting',
                    borderColor: 'rgb(255, 193, 7)',
                    backgroundColor: 'rgba(255, 193, 7, 0.1)',
                    data: [],
                    fill: true
                },
                {
                    label: 'Active Tickets',
                    borderColor: 'rgb(40, 167, 69)',
                    backgroundColor: 'rgba(40, 167, 69, 0.1)',
                    data: [],
                    fill: true
                },
                {
                    label: 'Active Tokens',
                    borderColor: 'rgb(23, 162, 184)',
                    backgroundColor: 'rgba(23, 162, 184, 0.1)',
                    data: [],
                    fill: true
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                x: { display: false },
                y: { beginAtZero: true }
            },
            animation: { duration: 0 }
        }
    });

    async function updateStats() {
        try {
            const response = await fetch(`/api/v2/queue/stats?contentId=${encodeURIComponent(CONTENT_ID)}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const body = await response.json();
            const stats = body?.data;
            if (!stats) {
                throw new Error('invalid stats payload');
            }

            waitCountEl.innerText = Number(stats.waiting || 0).toLocaleString();
            activeTicketCountEl.innerText = Number(stats.activeTickets || 0).toLocaleString();
            activeTokenCountEl.innerText = Number(stats.activeTokens || 0).toLocaleString();

            const now = new Date().toLocaleTimeString();
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(stats.waiting || 0);
            chart.data.datasets[1].data.push(stats.activeTickets || 0);
            chart.data.datasets[2].data.push(stats.activeTokens || 0);

            if (chart.data.labels.length > 50) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
                chart.data.datasets[2].data.shift();
            }

            chart.update();
        } catch (error) {
            console.error('Failed to fetch v2 stats:', error);
        }
    }

    function setMonitorMode(on) {
        monitorOn = on;
        if (monitorTimer) {
            clearInterval(monitorTimer);
            monitorTimer = null;
        }

        if (monitorOn) {
            monitorModeLabel.className = 'badge text-bg-success';
            monitorModeLabel.innerText = 'MONITOR ON';
            btnToggleMonitor.innerText = 'Turn OFF';
            updateStats();
            monitorTimer = setInterval(updateStats, 3000);
        } else {
            monitorModeLabel.className = 'badge text-bg-secondary';
            monitorModeLabel.innerText = 'MONITOR OFF';
            btnToggleMonitor.innerText = 'Turn ON';
        }
    }

    btnToggleMonitor.addEventListener('click', () => {
        setMonitorMode(!monitorOn);
    });

    // 기본값: OFF (성능 테스트 시 모니터 부하 분리 목적)
    setMonitorMode(false);
</script>
</body>
</html>
