<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Queue Monitor - Realtime Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <div class="row mb-4">
        <div class="col">
            <h1 class="display-4">🚀 Queue System Dashboard</h1>
            <p class="lead">Real-time monitoring of load test (k6)</p>
        </div>
    </div>

    <div class="row mb-4 text-center">
        <div class="col-md-4">
            <div class="card bg-secondary mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title text-warning">WAITING</h5>
                    <h2 id="waitCount" class="display-5 fw-bold">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-secondary mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title text-success">PROCEEDING</h5>
                    <h2 id="proceedCount" class="display-5 fw-bold">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-secondary mb-3 shadow">
                <div class="card-body">
                    <h5 class="card-title text-info">DONE</h5>
                    <h2 id="doneCount" class="display-5 fw-bold">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card bg-light p-4 shadow">
                <canvas id="queueChart" style="height: 400px; width: 100%;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const waitCountEl = document.getElementById('waitCount');
    const proceedCountEl = document.getElementById('proceedCount');
    const doneCountEl = document.getElementById('doneCount');

    const ctx = document.getElementById('queueChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Waiting',
                    borderColor: 'rgb(255, 193, 7)',
                    backgroundColor: 'rgba(255, 193, 7, 0.1)',
                    data: [],
                    fill: true
                },
                {
                    label: 'Proceeding',
                    borderColor: 'rgb(40, 167, 69)',
                    backgroundColor: 'rgba(40, 167, 69, 0.1)',
                    data: [],
                    fill: true
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                x: { display: false },
                y: { beginAtZero: true }
            },
            animation: { duration: 0 } // 실시간 반응을 위해 애니메이션 끔
        }
    });

    async function updateStats() {
        try {
            const response = await fetch('/api/v1/queue/stats');
            const stats = await response.json();

            // 숫자 텍스트 업데이트
            waitCountEl.innerText = stats.waiting.toLocaleString();
            proceedCountEl.innerText = stats.proceeding.toLocaleString();
            doneCountEl.innerText = stats.done.toLocaleString();

            // 차트 업데이트
            const now = new Date().toLocaleTimeString();
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(stats.waiting);
            chart.data.datasets[1].data.push(stats.proceeding);
            chart.data.datasets[2].data.push(stats.done);

            // 데이터가 너무 많으면 앞부분 제거
            if (chart.data.labels.length > 50) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
                chart.data.datasets[2].data.shift();
            }

            chart.update();
        } catch (error) {
            console.error('Failed to fetch stats:', error);
        }
    }

    // 0.5초마다 업데이트
    setInterval(updateStats, 500);
</script>

</body>
</html>
